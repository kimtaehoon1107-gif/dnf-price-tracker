name: 과거·신규 이력 병합 검사

on:
  pull_request:
    paths:
      - 'src/history-merge.ts'
      - 'src/build-replica.ts'
      - 'src/build-unified.ts'
      - 'src/build-db.ts'
      - 'web/build.ts'
      - 'src/archive.ts'
      - 'src/archive-retention.ts'
      - 'scripts/archive-research.ts'
      - 'scripts/prune-archive.ts'
      - 'scripts/test-archive-retention.ts'
      - '.github/workflows/archive-research.yml'
      - 'scripts/test-history-merge.ts'
      - 'scripts/test-build-replica.ts'
      - 'scripts/test-archive-site.ts'
      - 'config/history-sources.json'
      - '.github/workflows/history-merge-test.yml'

permissions:
  contents: read

jobs:
  history-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: history_test
          POSTGRES_PASSWORD: temporary-test-only
          POSTGRES_DB: history_merge_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U history_test -d history_merge_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - run: node --no-warnings scripts/test-history-merge.ts
        env:
          HISTORY_MERGE_TEST_URL: postgresql://history_test:temporary-test-only@127.0.0.1:55432/history_merge_test
      - run: node --no-warnings scripts/test-build-replica.ts
        env:
          HISTORY_MERGE_TEST_URL: postgresql://history_test:temporary-test-only@127.0.0.1:55432/history_merge_test
      - run: node --no-warnings scripts/test-archive-retention.ts
        env:
          HISTORY_MERGE_TEST_URL: postgresql://history_test:temporary-test-only@127.0.0.1:55432/history_merge_test

  archived-site:
    # 같은 저장소의 검토 중인 변경만 읽기 전용 보관본 검사에 사용한다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: archive_verify
          POSTGRES_PASSWORD: temporary-verification-only
          POSTGRES_DB: archive_verify
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U archive_verify -d archive_verify"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - name: R2 실자료의 전환 전후 전체 사이트 대조 (Supabase 접근 없음)
        run: node --no-warnings scripts/test-archive-site.ts
        env:
          ARCHIVE_VERIFY_URL: postgresql://archive_verify:temporary-verification-only@127.0.0.1:55432/archive_verify
          SITE_TEST_MANIFEST: manifests/e4e86c683473ae16d7f260c4062b4269c3c0b51ff198624239b78490924ba7c9.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
