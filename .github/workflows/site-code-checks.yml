name: 사이트 코드 검사
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'web/**'
      - 'sql/**'
      - 'config/**'
      - 'data/**'
      - 'package*.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: archive_verify
          POSTGRES_PASSWORD: temporary-test-only
          POSTGRES_DB: archive_verify
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U archive_verify -d archive_verify"
          --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: 정제 가격·게임일 SQL 검증
        env:
          DISPLAY_TEST_URL: postgresql://archive_verify:temporary-test-only@127.0.0.1:55432/archive_verify
        run: |
          node scripts/test-display-prices-db.ts
          node scripts/test-game-day-turnover-db.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/forecast-study-requirements.txt
      - run: python -m pip install -r scripts/forecast-study-requirements.txt
      - run: python scripts/test-inline-forecast.py
