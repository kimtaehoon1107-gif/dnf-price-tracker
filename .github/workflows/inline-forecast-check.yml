name: Inline forecast numerical checks
on:
  push:
    branches: [codex/forecast-fit-retry]
  pull_request:
    paths: ['scripts/*inline-forecast.py', 'scripts/forecast-study-requirements.txt']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/forecast-study-requirements.txt
      - run: python -m pip install -r scripts/forecast-study-requirements.txt
      - run: python scripts/test-inline-forecast.py
      - run: python scripts/reproduce-inline-forecast.py
