name: 공식 이벤트 동기화

on:
  # GitHub schedule은 이 저장소에서 신호 자체가 자주 누락돼 쓰지 않는다.
  # 목요일 01:30 UTC에 Supabase pg_cron이 workflow_dispatch를 호출한다.
  workflow_dispatch:

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - name: 던파 공식 공지 동기화
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --no-warnings scripts/sync-events.ts
