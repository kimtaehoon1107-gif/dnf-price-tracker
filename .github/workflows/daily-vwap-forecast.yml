name: 개별 평균 거래가 예측 검증
on:
  pull_request:
    paths:
      - '.github/workflows/daily-vwap-forecast.yml'
      - 'src/daily-forecast-ledger.ts'
      - 'scripts/*forecast*'
      - 'scripts/*arima*'
      - 'scripts/*daily-vwap*'
  workflow_run:
    workflows: ['사이트 배포']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 18 * * *'
permissions:
  contents: read
concurrency:
  group: daily-vwap-forecast-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  record:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'scripts/*requirements.txt'
      - run: pip install -r scripts/arima-diagnostics-requirements.txt
      - run: node --no-warnings scripts/test-daily-forecast-ledger.ts
      - run: python scripts/test-forecast-model-study.py && python scripts/test-arima-diagnostics-study.py
      - name: 예측 최초 발행 및 실제값 대조
        if: github.event_name != 'pull_request'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node --no-warnings scripts/record-daily-vwap.ts
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: daily-vwap-evaluation
          path: archive-work-daily-vwap/
          retention-days: 30
