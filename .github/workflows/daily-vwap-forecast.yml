name: 개별 평균 거래가 예측 검증
on:
  pull_request:
    paths:
      - '.github/workflows/daily-vwap-forecast.yml'
      - 'src/daily-forecast-ledger.ts'
      - 'src/daily-forecast-input.ts'
      - 'scripts/*forecast*'
      - 'scripts/*arima*'
      - 'scripts/*daily-vwap*'
  workflow_run:
    workflows: ['사이트 배포']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 18 * * *'
permissions:
  contents: read
concurrency:
  group: daily-vwap-forecast-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  record:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - name: 당일 완료 캐시 키
        id: day
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const day = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `key=daily-vwap-complete-v1-${sha}-${day}\n`);
          NODE
      # 완료 캐시가 없어도 최초 저장 전용 R2 원장이 중복 발행을 막는다.
      - name: 당일 처리 완료 확인
        id: completed
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/daily-vwap-complete
          key: ${{ steps.day.outputs.key }}
          lookup-only: true
      - name: 처리할 작업 없음
        if: steps.completed.outputs.cache-hit == 'true'
        run: echo '같은 코드의 당일 발행·실측 확정이 완료되어 설치·계산을 생략합니다.'
      - uses: actions/setup-node@v4
        if: steps.completed.outputs.cache-hit != 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
        if: steps.completed.outputs.cache-hit != 'true'
      - uses: actions/setup-python@v5
        if: steps.completed.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'scripts/*requirements.txt'
      - run: pip install -r scripts/arima-diagnostics-requirements.txt
        if: steps.completed.outputs.cache-hit != 'true'
      - run: node --no-warnings scripts/test-daily-forecast-ledger.ts
        if: github.event_name == 'pull_request'
      - run: python scripts/test-forecast-model-study.py && python scripts/test-arima-diagnostics-study.py
        if: github.event_name == 'pull_request'
      - name: 예측 최초 발행 및 실제값 대조
        id: record
        if: github.event_name != 'pull_request' && steps.completed.outputs.cache-hit != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node --no-warnings scripts/record-daily-vwap.ts
      - name: 완료 표시 생성
        if: steps.record.outputs.daily_complete == 'true'
        run: echo complete > "$RUNNER_TEMP/daily-vwap-complete"
      - uses: actions/upload-artifact@v4
        if: success() && steps.record.outcome == 'success'
        with:
          name: daily-vwap-evaluation
          path: archive-work-daily-vwap/
          retention-days: 30
      - name: 당일 완료 캐시 저장
        if: steps.record.outputs.daily_complete == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/daily-vwap-complete
          key: ${{ steps.day.outputs.key }}
