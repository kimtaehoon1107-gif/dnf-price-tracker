name: 사이트 배포

# 아이템별 수집 주기보다 느슨하게 매시간 굽는다.
# GitHub schedule은 이 저장소에서 누락된 전력이 있어 Supabase pg_cron이
# 매시 5분 workflow_dispatch를 호출한다 (sql/scheduler.sql).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/forecast.ts'
      - 'src/market-logic.ts'
      - 'src/candle-check.ts'
      - 'src/db.ts'
      - 'scripts/legendary-floor.ts'
      - 'scripts/scan-turnover.ts'
      - 'data/market-items.json'
      - 'data/legendary-cards.json'
      - 'certs/supabase-prod-ca-2021.crt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev

      # 스태커블 시장은 하루 한 번만 전수 조회한다. 스크립트가 DB의 마지막
      # 집계 시각을 확인하므로 매시간 배포돼도 23시간 안에는 즉시 종료한다.
      - name: 거래대금 TOP100 갱신
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --no-warnings scripts/scan-turnover.ts

      # 레전더리 카드 165종을 훑어 저가 지표를 갱신한다. 시간당 165회 호출이라
      # 초당 1,000건 제한 대비 무시할 수준이다.
      - name: 레전더리 카드 저가 지표 스캔
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --no-warnings scripts/legendary-floor.ts

      - name: 사이트 빌드
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --no-warnings web/build.ts

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
