name: 사이트 배포

# 아이템별 수집 주기보다 느슨하게 매시간 굽는다.
# 정적 사이트를 수집 때마다 재배포할 이유는 없다.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev

      # 레전더리 카드 165종을 훑어 최저가를 갱신한다. 시간당 165회 호출이라
      # 초당 1,000건 제한 대비 무시할 수준이다.
      - name: 레전더리 카드 최저가 스캔
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --no-warnings scripts/legendary-floor.ts
        continue-on-error: true

      - name: 사이트 빌드
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --no-warnings web/build.ts

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
