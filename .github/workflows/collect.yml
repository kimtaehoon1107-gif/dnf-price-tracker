name: 경매장 수집

on:
  schedule:
    # 10분마다. 각 실행이 9분간 내부 루프를 돌아 사실상 연속 수집이 된다.
    # Actions 크론은 부하 시 수 분 지연되므로 "정확히 10분"이 아니라 "대략 10분"이다.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# 이전 실행이 아직 도는 중이면 이번 실행은 건너뛴다. 겹쳐 돌아도 중복은
# DB가 걸러내지만, 겹치는 동안 API 호출만 두 배가 되므로 의미가 없다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --omit=dev

      - name: 수집 (9분)
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --no-warnings src/run.ts --minutes 9
