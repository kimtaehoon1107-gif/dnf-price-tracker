name: 경매장 수집

# 트리거는 GitHub 예약이 아니라 Supabase pg_cron이다.
#
# GitHub의 schedule은 best-effort라 부하가 높으면 실행을 아예 만들지 않는다.
# 실측(2026-09-07): */10 크론이 하루 종일 단 1회 떴고, 시각을 어긋내도 같았다.
# 취소·건너뜀 기록조차 없이 신호 자체가 안 온다.
#
# 반면 workflow_dispatch는 명시적 API 요청이라 큐에 바로 들어간다(실측 6/6).
# 그래서 실행 경로는 그대로 두고 시계만 밖으로 뺐다:
#
#   Supabase pg_cron (15분마다)
#     → pg_net으로 GitHub API workflow_dispatch 호출
#       → 이 워크플로 실행 (55분 내부 루프)
#
# cron job 이름: dnf-collect-dispatch  (등록 SQL은 sql/scheduler.sql)
# PAT는 Supabase Vault의 gh_dispatch_token에 있다.
#
# 15분마다 쏘지만 아래 concurrency 그룹이 겹침을 막는다. 이미 실행 중이면
# 새 요청은 대기했다가 앞 실행이 끝나는 즉시 이어받아 공백이 생기지 않는다.
on:
  workflow_dispatch:
    inputs:
      database:
        description: '수집 대상 (전환 준비용 B/C는 별도 동시 실행 그룹)'
        type: choice
        options: [current, B, C]
        default: current
      prime:
        description: '전환 첫 실행: 담당 아이템을 한 번 즉시 수집'
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.database == 'B' && 'collect-B' || inputs.database == 'C' && 'collect-C' || 'collect' }}
  cancel-in-progress: false

jobs:
  collect:
    name: 수집 (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        group: [hot, rest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --omit=dev

      - name: 전환 초기 수집
        if: inputs.prime
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          DATABASE_URL: ${{ secrets[inputs.database == 'B' && 'DATABASE_URL_B' || inputs.database == 'C' && 'DATABASE_URL_C' || 'DATABASE_URL'] }}
          COLLECT_SOURCE: actions
        run: node --no-warnings src/run.ts --once --group ${{ matrix.group }}

      - name: 수집 (55분)
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          DATABASE_URL: ${{ secrets[inputs.database == 'B' && 'DATABASE_URL_B' || inputs.database == 'C' && 'DATABASE_URL_C' || 'DATABASE_URL'] }}
          # 이 워크플로는 pg_cron의 workflow_dispatch로만 실행된다.
          # event_name으로 분기하면 전부 manual로 잘못 기록된다.
          COLLECT_SOURCE: actions
        run: node --no-warnings src/run.ts --minutes 55 --group ${{ matrix.group }}
