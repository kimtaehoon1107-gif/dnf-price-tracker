name: 경매장 수집

# GitHub의 스케줄 워크플로는 보장이 아니라 best-effort다. 실측(2026-09-07)에서
# */10 크론이 6시간 동안 단 1회만 떴다. 정각에 몰리는 고빈도 크론일수록
# 통째로 드롭된다.
#
# 그래서 전략을 바꿨다: 자주 뜨기를 기대하는 대신 "한 번 뜨면 오래 돌게" 한다.
#   · 15분마다 시도하되 어긋난 분(:07, :22, :37, :52)을 써서 정각 혼잡을 피한다
#   · 각 실행은 55분간 내부 루프를 돈다 → 시간당 한 번만 떠도 55분을 커버
#   · concurrency로 겹침을 막고, 대기 중인 실행이 앞 실행을 이어받는다
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: 수집 (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        group: [hot, rest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --omit=dev

      - name: 수집 (55분)
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_SOURCE: ${{ github.event_name == 'schedule' && 'actions' || 'manual' }}
        run: node --no-warnings src/run.ts --minutes 55 --group ${{ matrix.group }}
